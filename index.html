<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>Ukmergės atliekos</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f5f7;margin:0;color:#111827;transition:background .25s ease}
body.collection-today{background:#dff7e3}
body.collection-tomorrow{background:#fff4c2}
main{max-width:600px;margin:auto;padding:22px 18px 40px}
h1{font-size:30px;margin:8px 0 6px}.muted{color:#6b7280}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #00000010}
label{display:block;font-size:14px;color:#6b7280;margin:12px 0 6px}
select,input,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}
button{background:#111827;color:#fff;border:0;margin-top:14px;font-weight:600}
button.secondary{background:#fff;color:#111827;border:1px solid #d1d5db}
.next{font-size:22px;font-weight:700}.date{font-size:17px;margin-top:4px}
.row{padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.status{padding:10px 12px;border-radius:12px;background:#f3f4f6;margin-top:10px}
.collection-status{margin:14px 0 4px;padding:14px;border-radius:14px;font-size:20px;font-weight:800;text-align:center}
.collection-status.today{background:#b9edc3;color:#14532d}
.collection-status.tomorrow{background:#ffe680;color:#713f12}
</style>
</head>
<body>
<main>
<h1>Ukmergės atliekos</h1>
<div class="muted">Atliekų išvežimo grafikas</div>

<div class="card">
<label>Gatvė</label>
<select id="street"><option value="">Pasirink gatvę</option></select>
<label>Namo numeris</label>
<input id="number" inputmode="numeric" placeholder="pvz. 25">
<button onclick="saveAddress()">Išsaugoti adresą</button>
<button class="secondary" onclick="enableNotifications()">Įjungti priminimus</button>
<div id="notifyStatus" class="status">Pranešimai neįjungti.</div>
</div>

<div id="result"></div>
</main>

<script src="./app.js"></script>
</body>
</html>
